- file: datasets/UNFAO_CRBNLV.yaml
  field: source.note
  old: null
  new: Element 7215 was the legacy JSON API code for carbon stock in living biomass; the official bulk
    download publishes the same quantity (million t) under element 72151. The source description's 'millions
    of kg' is a legacy mislabel of the million-tonne series; values are not converted.
  reason: Record the element-code correction and the unit mislabel in the canonical file. The canonical
    unit 'million t' is the source unit; only the prose says kilograms. Recorded 2026-10-01.
- file: datasets/UNFAO_CRBNAV.yaml
  field: source.note
  old: null
  new: Derived dataset. The UNFAO_CRBNLV observations are normalized, then sspi.ingestion.derived repeats
    each country's 1990-1999 mean for every year in the source. The legacy unit label 'millions of kilograms'
    is a mislabel kept for parity; the values are means of the million-tonne level series, unconverted.
  reason: The legacy cleaner labelled the derived rows 'millions of kilograms (1990s Average)' while averaging
    values the source publishes in million tonnes, without converting. A label problem only; CARBON scores
    are a ratio of the two series and are unaffected. The label is kept because the derived unit is part
    of the legacy parity evidence. Recorded 2026-10-01.
- file: datasets/UNFAO_FRSTAV.yaml
