transformations:
- Markdown frontmatter converted to plain YAML, one file per code; prose bodies not migrated.
- Legacy PascalCase keys renamed to snake_case model fields (ItemCode->code, ItemName->name, DatasetCodes->dataset_codes,
  LowerGoalpost->lower_goalpost, UpperGoalpost->upper_goalpost, ScoreFunction->score_function, Policy->policy,
  Footnote->footnote, Description->description, DatasetCode->code, DatasetName->name, DatasetType->dataset_type,
  Unit->unit, Source.OrganizationCode->source.organization_code, Source.QueryCode->source.query_code,
  Source.OrganizationSeriesCode->source.organization_series_code, Source.OrganizationName->source.organization_name,
  Source.BaseURL->source.base_url, Source.Format->source.format, Source.Note->source.note).
- pillar_code and category_code written explicitly from the legacy methodology directory position (methodology/<pillar>/<category>/<indicator>/).
- 'Keys dropped: ItemType (implied by directory), Indicator and IndicatorCode (duplicates of name/code),
  DatasetProcessorFile (path into the legacy repository; wrong for at least 10 datasets).'
- Goalposts written as floats; numeric values unchanged.
- Trailing whitespace stripped from multi-line strings (description, score_function).
- Only datasets referenced by an indicator's DatasetCodes were migrated; referenced codes with no legacy
  definition were written as explicit unresolved entries.
- 'Country groups copied verbatim from local/country-groups.json into one country_groups.yaml: same group
  order, same member order, same memberships (SSPI67 keeps its 66 members). Legacy key CountryGroupName->code,
  Countries->members. No names, flags or attributes added; country names are derived from pycountry at
  load time exactly as the legacy loader did.'
- Pillar, category and SSPI-root definitions, organizations and time periods were not migrated in this
  step.
