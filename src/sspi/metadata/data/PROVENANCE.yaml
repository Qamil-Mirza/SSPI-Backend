    legacy unit label 'hectares' is a mislabel kept for parity; the values are means of the 1000 ha series.
  reason: Same label situation as UNFAO_CRBNAV ('hectares (1990s Average)' over a '1000 ha' series); DEFRST
    scores are a ratio and unaffected. Recorded 2026-10-01.
