  note: Total CO2 emissions of the transport sector, in kilograms (the source's MtCO2 times 10**9, as
    the legacy cleaner stored them). The legacy unit label 'Tonnes C02 per inhabitant' and the description's
    'tonnes' describe neither the stored quantity, which is a national total in kilograms, nor GTRANS's
    ratio to population, which is kilograms per person against goalposts of 7000 and 0 (GTRANS-1). The
    label is kept for parity.
