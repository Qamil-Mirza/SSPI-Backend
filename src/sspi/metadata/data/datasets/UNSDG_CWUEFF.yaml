code: UNSDG_CWUEFF
status: documented
name: Change in Water Use Efficiency
dataset_type: Intermediate
description: 'Change in Water Use Efficiency (WUE) from 2000-2005 average: WUE is the value added of a
  given major sector divided by the volume of water used. WUE at the national level is the sum of the
  efficiencies in the major economic sectors weighted according to the proportion of water withdrawn by
  each sector over the total withdrawals. This dataset provides percentage change values from 2006 onward.'''
unit: Percent
source:
  organization_code: UNSDG
  organization_series_code: ER_H2O_WUEYST
  query_code: 6.4.1
  dimensions:
    activity: TOTAL
  note: Derived dataset. The ER_H2O_WUEYST observations are normalized as UNSDG_WUSEFF, then
    sspi.ingestion.derived applies the legacy transform; percent change from the 2000-2005 mean,
    years from 2006.
