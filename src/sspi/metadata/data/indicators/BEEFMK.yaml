code: BEEFMK
name: Beef Market
pillar_code: SUS
category_code: GHG
policy: Methane Emissions
description: 'The average of two measures: beef and buffalo meat produced in kilograms per person, and
  per capita meat (beef) consumption. UN population estimates were used.'
footnote: null
dataset_codes:
- UNFAO_BFPROD
- UNFAO_BFCONS
- WB_POPULN
lower_goalpost: 50.0
upper_goalpost: 0.0
score_function: |-
  Score = average(
      goalpost(UNFAO_BFPROD / WB_POPULN, 50, 0),
      goalpost(UNFAO_BFCONS, 50, 0)
  )
