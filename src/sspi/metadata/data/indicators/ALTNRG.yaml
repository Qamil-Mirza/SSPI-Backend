code: ALTNRG
name: Alternative Energy Generation
pillar_code: SUS
category_code: NRG
policy: Renewable Energy Incentives
description: Total energy supply (excluding exports) from "renewable sources" (nuclear, hydroelectric,
  geothermal, solar, wind, and biofuels) minus half of total final energy supply from biofuel sources
  to penalize countries for unsustainable overreliance on biofuels.
footnote: null
dataset_codes:
- IEA_TLCOAL
- IEA_NATGAS
- IEA_NCLEAR
- IEA_HYDROP
- IEA_GEOPWR
- IEA_BIOWAS
- IEA_FSLOIL
lower_goalpost: 0.0
upper_goalpost: 60.0
score_function: Score = goalpost(((IEA_NCLEAR + IEA_HYDROP + IEA_GEOPWR + IEA_BIOWAS) - 0.5 * IEA_BIOWAS)
  / (IEA_TLCOAL + IEA_NATGAS + IEA_NCLEAR + IEA_HYDROP + IEA_GEOPWR + IEA_BIOWAS + IEA_FSLOIL) * 100,
  0, 60)
