# Alembic configuration. The database URL is intentionally absent: env.py
# resolves it from DATABASE_URL / the project .env via sspi.config, the same
# mechanism the runtime uses. Tests set it programmatically.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =
